# Copia dei backup fuori dal VPS su Backblaze B2, cifrata (decisione #22). NON applicato.
# Gira dopo il backup notturno (03:40) e copia i dump delle ultime 48 ore, cifrati con rclone crypt
# (nomi e contenuti). Il bucket deve avere Object Lock con retention 30 giorni: neanche chi ruba la chiave può cancellarli.
# La chiave B2 deve avere solo listFiles/readFiles/writeFiles sul bucket (niente deleteFiles).
# Se fallisce, avvisa su Telegram (stessi TELEGRAM_* del servizio), poi il Job risulta fallito.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fatturazione-backup-offsite
  namespace: platform
spec:
  schedule: "10 4 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: offsite
              image: rclone/rclone:1.68.2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}
                - {name: RCLONE_CONFIG, value: /tmp/rclone.conf}
                - {name: RCLONE_CONFIG_B2_TYPE, value: b2}
                - {name: RCLONE_CONFIG_B2_HARD_DELETE, value: "false"}
                - name: RCLONE_CONFIG_B2_ACCOUNT
                  valueFrom: {secretKeyRef: {name: fatturazione-offsite-secrets, key: B2_ACCOUNT_ID}}
                - name: RCLONE_CONFIG_B2_KEY
                  valueFrom: {secretKeyRef: {name: fatturazione-offsite-secrets, key: B2_APP_KEY}}
                - name: B2_BUCKET
                  valueFrom: {secretKeyRef: {name: fatturazione-offsite-secrets, key: B2_BUCKET}}
                - name: CRYPT_PASSWORD
                  valueFrom: {secretKeyRef: {name: fatturazione-offsite-secrets, key: CRYPT_PASSWORD}}
                - name: CRYPT_SALT
                  valueFrom: {secretKeyRef: {name: fatturazione-offsite-secrets, key: CRYPT_SALT}}
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom: {secretKeyRef: {name: fatturazione-api-secrets, key: TELEGRAM_BOT_TOKEN, optional: true}}
                - name: TELEGRAM_CHAT_ID
                  valueFrom: {configMapKeyRef: {name: fatturazione-core-config, key: TELEGRAM_CHAT_ID, optional: true}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  avvisa() {
                    [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] || return 0
                    wget -q -O /dev/null --post-data "chat_id=${TELEGRAM_CHAT_ID}&text=$1" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true
                  }
                  trap 'avvisa "fatturazione-core: copia backup fuori VPS FALLITA"' EXIT
                  export RCLONE_CONFIG_CIFRATO_TYPE=crypt
                  export RCLONE_CONFIG_CIFRATO_REMOTE="b2:${B2_BUCKET}/fatturazione"
                  export RCLONE_CONFIG_CIFRATO_PASSWORD="$(printf '%s' "$CRYPT_PASSWORD" | rclone obscure -)"
                  export RCLONE_CONFIG_CIFRATO_PASSWORD2="$(printf '%s' "$CRYPT_SALT" | rclone obscure -)"
                  N=$(find /backup -name 'fatturazione-*.dump' -mtime -2 | wc -l)
                  [ "$N" -ge 1 ] || { echo "nessun dump recente da copiare"; exit 1; }
                  rclone copy /backup cifrato: --include 'fatturazione-*.dump' --max-age 48h --immutable --no-traverse -v
                  rclone check /backup cifrato: --include 'fatturazione-*.dump' --max-age 48h --one-way
                  trap - EXIT
                  echo "copia offsite completata: $N dump"
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backup
              persistentVolumeClaim: {claimName: fatturazione-backup, readOnly: true}
            - name: tmp
              emptyDir: {}
