  name: fatturazione-core-config
  namespace: platform
data:
  # Valori dalla ricognizione del VPS e dal Centro Fatturazione (2026-11-07).
  PG_HOST: services-postgres
  PG_PORT: "5432"
  PG_SSL: "disable"                # services-postgres ha ssl=off (ricognizione); traffico confinato dalla NetworkPolicy (decisione #17)
  FORZA_BLOCCO: "false"            # "true" dopo un ripristino del DB (SPEC 7)
  RATE_LIMIT_PER_MIN: "120"
  BODY_LIMIT: "65536"
  PAGAMENTI_TIPO_DOCUMENTO: "fattura"            # decisione #15
  STRIPE_LIVEMODE: "true"                        # gli eventi Stripe di test vengono ignorati
  STRIPE_BUSINESS_PREDEFINITO: ""
  STRIPE_BUSINESS_PER_ACCOUNT: "acct_1QckZ6D55CvX97Iq=gazzolaelia.it,acct_1UZ3f2RcP2lkt5Lg=serrandasu.it"   # organizzazione Stripe (decisione #37)nizzazione, un account per attività: "acct_...=serrandasu.it,acct_...=heyciar.it,acct_...=gazzolaelia.it" (decisione #37)
  GC_TRIGGER_ACTION: "paid_out"                  # decisione #26
