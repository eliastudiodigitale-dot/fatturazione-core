# fatturazione-core: Deployment + Service. NON applicato. Le voci [DA DEFINIRE]/[DA VERIFICARE] vanno chiuse prima.
# Segreti: dal Secret esistente 'fatturazione-secrets' si prendono SOLO le chiavi dell'app (mai PG_USER/PG_PASS owner);
# il resto dal nuovo Secret 'fatturazione-api-secrets' (vedi secret-api.example.yaml, solo nomi).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fatturazione-core
  namespace: platform
  labels: {app: fatturazione-core}
spec:
  replicas: 1            # una replica: rate limit in memoria; il lock Postgres protegge comunque worker e riconciliazione
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: fatturazione-core}
  template:
    metadata:
      labels: {app: fatturazione-core}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: fatturazione-core:0.1.3   # importata in k3s, nessun registry (decisione #23); tag fisso, mai latest
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: fatturazione-core-config}
            - secretRef: {name: fatturazione-api-secrets}
          env:
            - name: PG_DB
              valueFrom: {secretKeyRef: {name: fatturazione-secrets, key: PG_DB}}
            - name: APP_PG_USER
              valueFrom: {secretKeyRef: {name: fatturazione-secrets, key: APP_PG_USER}}
            - name: APP_PG_PASS
              valueFrom: {secretKeyRef: {name: fatturazione-secrets, key: APP_PG_PASS}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: fatturazione-core
  namespace: platform
  labels: {app: fatturazione-core}
spec:
  type: ClusterIP
  selector: {app: fatturazione-core}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Configurazione NON segreta. Gli ID ClickUp sono un punto aperto (SPEC 12): finché mancano il worker resta spento.
apiVersion: v1
kind: ConfigMap
