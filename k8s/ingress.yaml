# Esposizione pubblica: solo /webhooks/* (Stripe, GoCardless). NON applicato.
# L'API /v1 resta interna al cluster (n8n e dashboard nel namespace platform).
# Host: gestione.gazzolaelia.it (decisione #19). [DA VERIFICARE] come vengono emessi i certificati sul VPS. Solo HTTPS.
# Solo i due percorsi esatti dei webhook: il resto dell'host resta libero per altri servizi (es. dashboard in Fase 3).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fatturazione-core-webhooks
  namespace: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure   # [DA VERIFICARE] ingress controller in uso
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [gestione.gazzolaelia.it]
      secretName: TLS_DA_DEFINIRE
  rules:
    - host: gestione.gazzolaelia.it
      http:
        paths:
          - path: /webhooks/stripe
            pathType: Exact
            backend:
              service:
                name: fatturazione-core
                port: {name: http}
          - path: /webhooks/gocardless
            pathType: Exact
            backend:
              service:
                name: fatturazione-core
                port: {name: http}
