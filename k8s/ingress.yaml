# Esposizione pubblica: solo i due webhook (Stripe, GoCardless). L'API /v1 resta interna al cluster.
# Host: gestione.gazzolaelia.it (decisione #19). Certificato: Traefik, resolver "le" (Let's Encrypt via DNS Cloudflare),
# lo stesso configurato sul VPS (ricognizione-2). Solo HTTPS: nessun router sull'entrypoint "web".
# Solo i due percorsi esatti: il resto dell'host resta libero per altri servizi (es. dashboard in Fase 3).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fatturazione-core-webhooks
  namespace: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  rules:
    - host: gestione.gazzolaelia.it
      http:
        paths:
          - path: /webhooks/stripe
            pathType: Exact
            backend:
              service:
                name: fatturazione-core
                port: {name: http}
          - path: /webhooks/gocardless
            pathType: Exact
            backend:
              service:
                name: fatturazione-core
                port: {name: http}
