# MODELLO: solo i nomi delle chiavi, nessun valore. Il Secret vero lo crea Elia sul VPS, mai nel repo.
# Token: almeno 32 caratteri casuali ciascuno (es. openssl rand -hex 32). STRIPE_API_KEY = chiave RISTRETTA in sola lettura.
apiVersion: v1
kind: Secret
metadata:
  name: fatturazione-api-secrets
  namespace: platform
type: Opaque
stringData:
  N8N_TOKEN: ""
  DASHBOARD_TOKEN: ""
  OWNER_TOKEN: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_API_KEY: ""
  GC_WEBHOOK_SECRET: ""
  GC_API_TOKEN: ""
  CLICKUP_TOKEN: ""
  # CRM e ticketing (#45): si aggiungono con scripts/vps/imposta-chiavi-crm.sh, non con crea-secret.sh.
  # Un token per ogni fonte elencata in TICKET_FONTI (min 32 caratteri, tutti diversi tra loro e dagli altri token).
  TICKET_TOKEN_HEYCIAR: ""
  TICKET_TOKEN_SERRANDASU: ""
  TICKET_TOKEN_RETI: ""
  # Token che questo servizio USA per chiamare il backend ticket di un business (#46): uno per ogni TICKET_BACKEND_URL_<FONTE> impostato.
  TICKET_BACKEND_TOKEN_HEYCIAR: ""
  TICKET_BACKEND_TOKEN_SERRANDASU: ""
  TICKET_BACKEND_TOKEN_RETI: ""
  # Dashboard: segreto del client Keycloak (confidential) e segreto per firmare il cookie di sessione (min 32 caratteri).
  KEYCLOAK_CLIENT_SECRET: ""
  DASHBOARD_SESSION_SECRET: ""
