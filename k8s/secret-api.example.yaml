apiVersion: v1
kind: Secret
metadata:
  name: fatturazione-api-secrets
  namespace: platform
type: Opaque
stringData:
  N8N_TOKEN: ""
  DASHBOARD_TOKEN: ""
  OWNER_TOKEN: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_API_KEY: ""
  GC_WEBHOOK_SECRET: ""
  GC_API_TOKEN: ""
  CLICKUP_TOKEN: ""
